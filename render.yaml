# Render Blueprint for Find My Game Parts. Validate after any change:
#   render blueprints validate
#
# One Docker-based web service (this app) plus its own isolated Postgres
# database. Keycloak is NOT deployed here — it's self-hosted separately
# (shared with another project, reached via Cloudflare Tunnel) and is out
# of this blueprint's scope entirely. See README's "Production deployment"
# for how the app's Keycloak env vars get pointed at that instance.
#
# Values marked `sync: false` are NOT stored here — set them in the Render
# dashboard after the first deploy (see README's "Production deployment").

databases:
  - name: find-my-game-parts-db
    plan: basic-256mb
    databaseName: find_my_game_parts
    user: app

services:
  - type: web
    name: find-my-game-parts-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    # Runs after the image builds but before the new instance starts
    # serving traffic — applies pending migrations automatically on every
    # deploy. Added after a real deploy went live with the schema never
    # applied at all (a one-off manual step that's easy to forget).
    #
    # `prisma` (the CLI) is deliberately NOT a production dependency — its
    # own dependency tree includes mysql2/deepmerge-ts, which carry real
    # Snyk-flagged high-severity findings we don't want in the production
    # tree for a Postgres-only app. `npx --yes prisma@7.10.0` fetches the
    # exact same pinned version used everywhere else in this repo, fresh,
    # each deploy, without ever touching package.json/package-lock.json.
    preDeployCommand: npx --yes prisma@7.10.0 migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: find-my-game-parts-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Set after the first deploy, once you know this service's real URL:
      - key: NEXTAUTH_URL
        sync: false
      # Both point at the self-hosted Keycloak instance's public hostname
      # (e.g. https://auth.findmygame.parts) — see README's "Production
      # deployment" for why these are the same host here (no internal/
      # external split, since Keycloak isn't on Render at all).
      - key: KEYCLOAK_ISSUER
        sync: false
      - key: KEYCLOAK_PUBLIC_URL
        sync: false
      - key: KEYCLOAK_REALM
        value: find-my-game-parts
      - key: KEYCLOAK_CLIENT_ID
        value: find-my-game-parts
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_ADMIN_GROUP
        value: admin
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BGG_API_BASE
        value: https://boardgamegeek.com/xmlapi2
      - key: BGG_API_TOKEN
        sync: false
