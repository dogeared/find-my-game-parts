name: CI

on:
  push:
    branches: [main, concierge-mvp]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # prisma generate only reads schema.prisma, it never connects — this
      # value just satisfies prisma.config.ts's env("DATABASE_URL") lookup.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Snyk job temporarily removed — snyk code test hung indefinitely in CI
  # more than once (quota exhaustion, then an org-level Snyk Code
  # enablement gap), and even with per-step timeouts added as a backstop,
  # the timing is still unreliable enough to be worth pulling out of the
  # required checks entirely until it's sorted out. It's still enforced
  # locally via .husky/pre-push. Re-add once confirmed stable.

  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Idempotent: tags `vX.Y.Z` from package.json's current version, but
      # only if that tag doesn't already exist on origin — so re-running
      # this workflow, or pushing to main without a version bump, is a
      # no-op rather than a duplicate/failing tag push.
      - name: Tag version if new
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
