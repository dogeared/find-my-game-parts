name: CI

on:
  push:
    branches: [main, concierge-mvp]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # prisma generate only reads schema.prisma, it never connects — this
      # value just satisfies prisma.config.ts's env("DATABASE_URL") lookup.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  security:
    name: Snyk
    runs-on: ubuntu-latest
    # Backstop for the whole job — hit live: `snyk test` hung indefinitely
    # in this exact job (quota-exhausted service account token seemingly
    # handled differently than an interactive session, which just prints
    # a warning and exits normally) and had to be cancelled by hand.
    # Every observed successful run finishes in well under a minute, but
    # a first run right after enabling Snyk Code on a new org can take
    # longer (backend indexing) — sized to comfortably fit both 5-minute
    # per-step timeouts below plus checkout/setup/npm ci overhead.
    # Re-added after upgrading to a paid Snyk account (the quota-exhaustion
    # root cause) and rotating SNYK_TOKEN to that account's token.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder

      - uses: snyk/actions/setup@master

      # --org explicitly: the token has no default org, and Snyk Code
      # ignores (set in the web UI — a .snyk file can't ignore Code
      # findings) live on the find-my-game-parts project in this org.
      - run: snyk test --org=micah.silvermansnyk.io
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - run: snyk code test --org=micah.silvermansnyk.io
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Idempotent: tags `vX.Y.Z` from package.json's current version, but
      # only if that tag doesn't already exist on origin — so re-running
      # this workflow, or pushing to main without a version bump, is a
      # no-op rather than a duplicate/failing tag push.
      - name: Tag version if new
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

  # Publishes the NAS's copy of this app. The Synology pulls `:latest` over the deploy webhook;
  # `:sha-<short>` and the version tag are there for pinning a rollback.
  #
  # Deliberately needs only `test`: the Snyk job still fails the CI run for humans, but
  # a newly-disclosed advisory in a transitive dependency must not freeze deploys of
  # unrelated fixes (that is exactly what happened the day this was added).
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/find-my-game-parts
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This is the only deploy path: the agent is reachable only through the NAS's
  # Cloudflare tunnel and authorises each call with an HMAC over
  # "<timestamp>.<body>". Missing secrets are a setup error, so fail loudly
  # rather than leave the NAS on the previous image.
  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: find-my-game-parts
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL / DEPLOY_WEBHOOK_SECRET are not set"
            exit 1
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1
