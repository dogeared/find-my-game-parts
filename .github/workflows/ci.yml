name: CI

on:
  push:
    branches: [main, concierge-mvp]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # prisma generate only reads schema.prisma, it never connects — this
      # value just satisfies prisma.config.ts's env("DATABASE_URL") lookup.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  security:
    name: Snyk
    runs-on: ubuntu-latest
    # Backstop for the whole job — hit live: `snyk test` hung indefinitely
    # in this exact job (quota-exhausted service account token seemingly
    # handled differently than an interactive session, which just prints
    # a warning and exits normally) and had to be cancelled by hand.
    # Every observed successful run finishes in well under a minute, but
    # a first run right after enabling Snyk Code on a new org can take
    # longer (backend indexing) — sized to comfortably fit both 5-minute
    # per-step timeouts below plus checkout/setup/npm ci overhead.
    # Re-added after upgrading to a paid Snyk account (the quota-exhaustion
    # root cause) and rotating SNYK_TOKEN to that account's token.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder

      - uses: snyk/actions/setup@master

      # --org explicitly: the token has no default org, and Snyk Code
      # ignores (set in the web UI — a .snyk file can't ignore Code
      # findings) live on the find-my-game-parts project in this org.
      - run: snyk test --org=micah.silvermansnyk.io
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - run: snyk code test --org=micah.silvermansnyk.io
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Idempotent: tags `vX.Y.Z` from package.json's current version, but
      # only if that tag doesn't already exist on origin — so re-running
      # this workflow, or pushing to main without a version bump, is a
      # no-op rather than a duplicate/failing tag push.
      - name: Tag version if new
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
