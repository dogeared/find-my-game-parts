services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3030:3000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/find_my_game_parts
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      # Internal Docker network address — NOT overridable via .env. The app
      # container uses this for server-to-server calls (discovery, token
      # exchange, userinfo, jwks); your browser can never reach this
      # hostname, which is exactly why KEYCLOAK_PUBLIC_URL exists below.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-find-my-game-parts}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-find-my-game-parts}
      # Browser-facing base (no realm path) — this is what actually needs
      # to match your host port mapping below if you ever change it.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-find-my-game-parts}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # Keycloak group whose members get isAdmin — must match an actual
      # group in Keycloak's console (README: "Admins are managed via
      # Keycloak groups").
      KEYCLOAK_ADMIN_GROUP: ${KEYCLOAK_ADMIN_GROUP:-admin}
      MJ_APIKEY_PUBLIC: ${MJ_APIKEY_PUBLIC:-}
      MJ_APIKEY_PRIVATE: ${MJ_APIKEY_PRIVATE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BGG_API_BASE: https://boardgamegeek.com/xmlapi2
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
      - keycloak

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: find_my_game_parts
    ports:
      # Host port 6543 (not Postgres's default 5432) to avoid colliding with
      # another project's Postgres running at the same time.
      - "6543:5432"
    volumes:
      - db-data:/var/lib/postgresql

  # Local dev only — start-dev uses an embedded dev database and is not how
  # the design doc's self-hosted Keycloak instance gets deployed for real.
  # Google/Facebook IdP federation still requires the founder's own console
  # setup (see docs/designs/find-my-game-parts.md, Dependencies).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      # Host port 8090 (not Keycloak's default 8080) so this can run
      # alongside another project's own Keycloak instance at the same time.
      - "8090:8080"
    volumes:
      # Custom login theme (keycloak/themes/find-my-game-parts/) — matches
      # the app's own Parchment palette/fonts. start-dev doesn't cache
      # themes, so this takes effect immediately with no rebuild/restart.
      # Still needs the realm's Login Theme set to "find-my-game-parts"
      # once (README's Keycloak setup section) — the file alone doesn't
      # activate it.
      - ./keycloak/themes:/opt/keycloak/themes:ro

volumes:
  db-data:
