# Extends Keycloak 26.x's default login theme (keycloak.v2) rather than
# forking any .ftl templates — this is a CSS-only reskin. Confirmed the
# base theme's actual structure/class names by extracting
# org.keycloak.keycloak-themes-26.4.7.jar from the running container
# (theme/keycloak.v2/login) rather than guessing from memory.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css

# The app itself has one fixed light palette (Parchment) plus a separate
# accessibility high-contrast toggle — it doesn't follow OS dark-mode
# preference. Disabling Keycloak's automatic dark-mode class swap keeps
# the login page visually consistent with that, in every browser/OS
# setting, without needing a second palette here.
darkMode=false
